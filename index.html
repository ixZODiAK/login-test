<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Windows Login</title>
</head>
<body>
    
    <div class="container">

        <img src="images.jpeg" alt="Windows Logo" class="logo">

        <h1 class="title">Login</h1>

        <div class="input">
            <input id="user-input" type="password" placeholder="Enter your password"  required >
            <button type="submit" id="btn" >Login</button>
        </div>

        <a href="#" id="forgetPass">Forgot password?</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
